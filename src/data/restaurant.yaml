# Informations générales du restaurant.
# Tout ce qui est ici apparaît sur le site ET dans les données lues par Google (JSON-LD).
# Les horaires s'écrivent "HH:MM-HH:MM", ou "fermé".

nom: Fat & Furious Diner
accroche: Votre 1er diner américain à Tahiti
description: >-
  Burgers fat au bœuf Angus, hot-dogs et milkshakes furious dans une ambiance
  100 % rock & diner. Le goût de l'Amérique à Tahiti, à Pirae.

contact:
  telephone: '40 57 67 76'
  # Format international, utilisé pour le lien "appeler" et pour Google.
  telephoneInternational: '+68940576776'

