  jours: [lundi, mardi, mercredi, jeudi]
  horaire: '16:30-18:00'
  offre: -20 % sur les cocktails, mocktails et bières pour l'achat d'un starter
  pastille: '-20 %' # texte de la pastille étoilée (facultatif)

# Section "À propos". Texte repris des publications Facebook du restaurant.
# TODO : remplacer par le texte "notre histoire" fourni par le client.
aPropos:
  titre: Le goût de l'Amérique à Tahiti
  paragraphes:
    - >-
      Fat & Furious, c'est le premier diner américain de Tahiti : des banquettes
      rouges, du chrome, du rock et une ambiance 100 % diner, à Pirae.
    - >-
      Au programme de ce road-trip culinaire : des burgers XXL au bœuf Angus,
      encore plus fat, encore plus furious, des starters à partager (ou pas) et
      des milkshakes qui te téléportent dans les années 80.
  points:
    - Bœuf Angus frais
    - Burgers XL & XXL
    - Sans réservation
    - Fun garanti
  image: ../assets/gallery/salle.jpg
  imageAlt: La salle du diner avec ses banquettes rouges et blanches

reservation: false # "Sans réservation"
