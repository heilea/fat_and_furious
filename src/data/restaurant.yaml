  codePostal: '98716'
  commune: Pirae
  ile: Tahiti
  pays: PF # code ISO du pays (Polynésie française)
  repere: Derrière l'OPT et la Banque de Polynésie
  # TODO : coller le lien Google Maps exact de la fiche du restaurant.
  lienMaps: https://www.google.com/maps/search/?api=1&query=Fat+%26+Furious+Diner+Pirae+Tahiti
  # TODO : renseigner les coordonnées GPS exactes (clic droit sur le point dans Google Maps).
  # gps:
  #   latitude: -17.5
  #   longitude: -149.5

fuseauHoraire: Pacific/Tahiti

horaires:
  lundi: '11:00-21:00'
  mardi: '11:00-21:00'
  mercredi: '11:00-21:00'
  jeudi: '11:00-21:00'
  vendredi: '11:00-21:30'
  samedi: '11:00-21:30'
  dimanche: '11:00-21:00'

brunch:
  jours: [samedi, dimanche]
  horaire: '06:30-11:00'
  description: >-
    Eggs Benedict, pancakes, gaufres, bagels, viennoiseries et nos breakfasts
    français, américain et polynésien. Avec un café, un jus frais, un milkshake
    ou un petit cocktail.

