# La carte du restaurant, catégorie par catégorie, dans l'ordre d'affichage.
# Source : la nouvelle carte publiée sur Facebook (octobre 2026). Prix en XPF.
#
# Une catégorie :
#   - id: identifiant court, sans espace ni accent (sert au filtre et aux liens)
#     titre: nom affiché sur l'onglet et en titre
#     note: (facultatif) petite ligne sous le titre
#     visible: (facultatif) false pour masquer la catégorie sans la supprimer
#     produits: la liste des produits
#
# Un produit :
#   - nom: nom affiché
#     description: (facultatif) composition
#     prix: prix en XPF, en chiffres
#     prixLibelle: (facultatif) à la place de "prix" quand le prix varie, ex. "350 – 900"
#     tags: (facultatif) pastilles parmi : nouveau, a-partager, signature
#     image: (facultatif) photo dans src/assets/menu/, ex. ../assets/menu/bomburger.jpg

