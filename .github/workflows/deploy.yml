# Déploiement automatique sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source : "GitHub Actions".
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22.23.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
